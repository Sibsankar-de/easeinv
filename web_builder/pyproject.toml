[project]
name = "web_builder"
version = "0.1.0"
description = "Web builder service for easeinv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3",
    "boto3>=1.43.126",
    "exa-py>=2.28.0",
    "fastapi[standard]>=0.161.0",
    "fastmcp>=4.1.8",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
