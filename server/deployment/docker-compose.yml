version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: easeinv-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: easeinv
      RABBITMQ_DEFAULT_PASS: qwbtre*i184r
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
