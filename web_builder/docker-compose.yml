services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: easeinv_seaweedfs
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    command: "server -s3 -dir=/data -s3.port=8333 -ip.bind=0.0.0.0"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: easeinv_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  command_executor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: easeinv-sandbox
    privileged: false
    volumes:
      - type: bind
        source: ./workspace
        target: /workspace
      - type: bind
        source: ./scripts
        target: /scripts
        read_only: true
    networks:
      - sandbox-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

networks:
  sandbox-network:
    name: sandbox-network

volumes:
  seaweedfs_data:
  qdrant_data:
